[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srmini-ble"
version = "0.1.0"
description = "Unofficial Python BLE control for the iGPSPORT SR Mini light"
requires-python = ">=3.10"
dependencies = ["bleak>=0.21"]

[project.scripts]
srmini = "srmini_ble.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
